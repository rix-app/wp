<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mic Visualizer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  overflow:hidden;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial;
}

/* FUNDO */
.bg{
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle at center,
    rgba(16,163,127,.3),
    transparent 50%),
    #020617;
}

/* VISUALIZER */
.visualizer{
  position:relative;

  width:320px;
  height:180px;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  gap:8px;

  z-index:2;
}

.bar{
  width:14px;

  height:40px;

  border-radius:20px;

  background:#10a37f;

  box-shadow:
    0 0 20px rgba(16,163,127,.7);
}

/* BOTÃO */
.controls{
  position:fixed;
  bottom:40px;

  z-index:5;
}

button{
  border:none;

  padding:16px 26px;

  border-radius:18px;

  background:#10a37f;

  color:white;

  font-size:18px;

  cursor:pointer;
}

.title{
  position:fixed;
  top:80px;

  color:white;

  font-size:42px;

  z-index:5;

  text-shadow:
    0 0 30px rgba(255,255,255,.3);
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="title">
  Voice Visualizer
</div>

<div class="visualizer" id="visualizer"></div>

<div class="controls">
  <button id="startBtn">
    Ativar Microfone
  </button>
</div>

<script>

const visualizer =
  document.getElementById("visualizer");

// cria barras
for(let i=0;i<24;i++){

  const bar =
    document.createElement("div");

  bar.classList.add("bar");

  visualizer.appendChild(bar);
}

const bars =
  document.querySelectorAll(".bar");

async function startMic(){

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio:true
    });

  const audioCtx =
    new AudioContext();

  const analyser =
    audioCtx.createAnalyser();

  analyser.fftSize = 64;

  const source =
    audioCtx.createMediaStreamSource(stream);

  source.connect(analyser);

  const dataArray =
    new Uint8Array(analyser.frequencyBinCount);

  animate();

  function animate(){

    requestAnimationFrame(animate);

    analyser.getByteFrequencyData(dataArray);

    bars.forEach((bar,i)=>{

      const value =
        dataArray[i] || 0;

      const height =
        Math.max(20,value * 2);

      bar.style.height =
        height + "px";

      bar.style.transform =
        `translateY(${-value/12}px)`;

      bar.style.opacity =
        0.5 + value/255;
    });

    // fundo pulsando
    document.querySelector(".bg")
      .style.transform =
        `scale(${1 + dataArray[1]/500})`;
  }
}

document
  .getElementById("startBtn")
  .onclick = startMic;

</script>

</body>
</html>
