<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Video Trigger</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  overflow:hidden;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial;
}

video{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transition:opacity .25s ease;
}

.overlay{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  z-index:5;

  background:rgba(0,0,0,.4);

  color:white;
}

button{
  border:none;

  padding:18px 28px;

  border-radius:18px;

  background:#10a37f;

  color:white;

  font-size:18px;

  cursor:pointer;
}

.status{
  margin-top:20px;
  opacity:.7;
}
</style>
</head>
<body>

<!-- coloque seu arquivo -->
<video
  id="video"
  src="video.mp4"
  loop
  muted
  playsinline>
</video>

<div class="overlay">

  <h1>Voice Reactive Video</h1>

  <br>

  <button id="startBtn">
    Ativar Microfone
  </button>

  <div class="status">
    o vídeo aparece quando detectar voz/som forte
  </div>

</div>

<script>

const video =
  document.getElementById("video");

async function start(){

  const stream =
    await navigator.mediaDevices.getUserMedia({
      audio:true
    });

  const ctx =
    new AudioContext();

  const analyser =
    ctx.createAnalyser();

  analyser.fftSize = 256;

  const source =
    ctx.createMediaStreamSource(stream);

  source.connect(analyser);

  const data =
    new Uint8Array(analyser.frequencyBinCount);

  video.play();

  animate();

  function animate(){

    requestAnimationFrame(animate);

    analyser.getByteFrequencyData(data);

    let avg = 0;

    for(let i=0;i<data.length;i++){
      avg += data[i];
    }

    avg /= data.length;

    // AJUSTE SENSIBILIDADE
    if(avg > 35){

      video.style.opacity = 1;

    }else{

      video.style.opacity = 0;
    }
  }
}

document
  .getElementById("startBtn")
  .onclick = start;

</script>

</body>
</html>
