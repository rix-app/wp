<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Voice Reactive</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#020617;
  height:100vh;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
  backdrop-filter:blur(10px);
}

.title{
  color:white;
  font-size:60px;
  margin-bottom:20px;
  text-shadow:0 0 30px rgba(255,255,255,.5);
}

button{
  border:none;
  padding:18px 30px;
  border-radius:20px;
  background:#10a37f;
  color:white;
  font-size:20px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:scale(1.05);
}

.info{
  color:white;
  opacity:.7;
  margin-top:20px;
  text-align:center;
  max-width:600px;
  line-height:1.5;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="overlay">

  <div class="title">
    Voice Reactive
  </div>

  <button id="startBtn">
    Ativar Voice + Áudio
  </button>

  <div class="info">
    Compartilhe a guia com áudio quando pedir permissão.
  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w,h;

function resize(){
  w = canvas.width = innerWidth;
  h = canvas.height = innerHeight;
}

resize();
addEventListener("resize",resize);

async function start(){

  // abre chatgpt voice
  window.open(
    "https://chatgpt.com/voice",
    "_blank"
  );

  // captura áudio interno
  const stream =
    await navigator.mediaDevices.getDisplayMedia({
      video:true,
      audio:true
    });

  const audioCtx = new AudioContext();

  const source =
    audioCtx.createMediaStreamSource(stream);

  const analyser =
    audioCtx.createAnalyser();

  analyser.fftSize = 512;

  source.connect(analyser);

  const bufferLength =
    analyser.frequencyBinCount;

  const dataArray =
    new Uint8Array(bufferLength);

  animate();

  function animate(){

    requestAnimationFrame(animate);

    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0,0,w,h);

    const cx = w/2;
    const cy = h/2;

    let avg =
      dataArray.reduce((a,b)=>a+b,0)
      / bufferLength;

    const bass = dataArray[5] || 0;

    // fundo pulsando
    const gradient =
      ctx.createRadialGradient(
        cx,cy,100,
        cx,cy,600 + avg*2
      );

    gradient.addColorStop(
      0,
      `rgba(16,163,127,${
        0.4 + avg/500
      })`
    );

    gradient.addColorStop(
      1,
      `rgba(2,6,23,1)`
    );

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,w,h);

    // círculo central
    const radius =
      100 + bass*1.5;

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      radius,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      `rgba(16,163,127,.8)`;

    ctx.shadowBlur = 80;
    ctx.shadowColor = "#10a37f";

    ctx.fill();

    // barras radiais
    const bars = 220;

    for(let i=0;i<bars;i++){

      const angle =
        (Math.PI*2/bars)*i;

      const value =
        dataArray[i%bufferLength];

      const len =
        value*1.8;

      const x1 =
        cx + Math.cos(angle)*radius;

      const y1 =
        cy + Math.sin(angle)*radius;

      const x2 =
        cx + Math.cos(angle)*(radius+len);

      const y2 =
        cy + Math.sin(angle)*(radius+len);

      ctx.beginPath();

      ctx.moveTo(x1,y1);

      ctx.lineTo(x2,y2);

      ctx.strokeStyle =
        `hsl(${i*2 + avg},100%,60%)`;

      ctx.lineWidth = 3;

      ctx.stroke();
    }

    // partículas
    for(let i=0;i<40;i++){

      const size =
        Math.random()*4 + 1;

      const x =
        Math.random()*w;

      const y =
        Math.random()*h;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        size + avg/80,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        `rgba(255,255,255,${
          Math.random()
        })`;

      ctx.fill();
    }
  }
}

document
  .getElementById("startBtn")
  .onclick = start;

</script>

</body>
</html>
